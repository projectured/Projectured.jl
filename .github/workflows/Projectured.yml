concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }}, Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write          # the upload to Codecov through OIDC
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
        package:
          - Projectured
        include:
          - {package: Projectured, develop: 'ProjecturedKernel ProjecturedPlatform Projectured ProjecturedACP example/ProjecturedKernelExample test/ProjecturedKernelTest test/ProjecturedACPTest ProjecturedBook ProjecturedChart ProjecturedConsole ProjecturedSQL ProjecturedDBCatalog ProjecturedDatabase ProjecturedGraph ProjecturedJulia ProjecturedFSM ProjecturedMath ProjecturedFormula ProjecturedJSON ProjecturedMarkdown ProjecturedPDF ProjecturedPivot ProjecturedProcess ProjecturedRST ProjecturedSequenceChart ProjecturedXML ProjecturedYAML ProjecturedAll ProjecturedAnthropic test/ProjecturedAnthropicTest example/ProjecturedPlatformExample example/ProjecturedBookExample test/ProjecturedPlatformTest test/ProjecturedBookTest example/ProjecturedChartExample test/ProjecturedChartTest example/ProjecturedJSONExample test/ProjecturedConsoleTest example/ProjecturedJuliaExample example/ProjecturedMarkdownExample example/ProjecturedXMLExample example/ProjecturedYAMLExample example/ProjecturedConversationExample example/ProjecturedDBCatalogExample test/ProjecturedDBCatalogTest ProjecturedDataFrames example/ProjecturedDataFramesExample test/ProjecturedDataFramesTest example/ProjecturedDatabaseExample test/ProjecturedDatabaseTest example/ProjecturedFSMExample example/ProjecturedFormulaExample example/ProjecturedGraphExample example/ProjecturedMathExample ProjecturedOllama example/ProjecturedPivotExample example/ProjecturedProcessExample example/ProjecturedRSTExample example/ProjecturedSQLExample example/ProjecturedSequenceChartExample example/ProjecturedExample test/ProjecturedFSMTest test/ProjecturedFormulaTest test/ProjecturedGraphTest ProjecturedMCP ProjecturedODBC ProjecturedSDL ProjecturedTulip ProjecturedVideo test/ProjecturedJSONTest test/ProjecturedJuliaTest test/ProjecturedMCPTest test/ProjecturedMarkdownTest test/ProjecturedMathTest test/ProjecturedODBCTest test/ProjecturedOllamaTest test/ProjecturedPDFTest test/ProjecturedPivotTest test/ProjecturedProcessTest test/ProjecturedRSTTest example/ProjecturedSDLExample test/ProjecturedSDLTest test/ProjecturedSQLTest test/ProjecturedSequenceChartTest test/ProjecturedTulipTest test/ProjecturedVideoTest ProjecturedWeb test/ProjecturedWebTest test/ProjecturedXMLTest test/ProjecturedYAMLTest test/ProjecturedTest', coverage: 'Projectured/src'}
    env:
      SDL_VIDEODRIVER: offscreen      # SDL draws into memory; the runner has no display
      JULIA_PKG_PRECOMPILE_AUTO: '0'  # the test compiles what it loads
      PACKAGE: ${{ matrix.package }}
      DEVELOP: ${{ matrix.develop }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
        with:
          # A key with the matrix would hold the list of folders, which is
          # longer than a key may be.
          include-matrix: false
          cache-name: julia-cache;package=${{ matrix.package }};julia=${{ matrix.julia }}
      # AutoIntegration, AgentClientProtocol and ClaudeCodeACP are packages of
      # other repositories, which no job develops. They come from
      # ProjecturedRegistry, which the job adds beside General.
      - name: Add the registries
        run: >-
          julia --project="$RUNNER_TEMP/environment"
          -e 'using Pkg; Pkg.Registry.add("General");
          Pkg.Registry.add(url = "https://github.com/projectured/ProjecturedRegistry")'
      - name: Develop the packages that the test needs
        run: >-
          julia --project="$RUNNER_TEMP/environment"
          -e 'using Pkg; Pkg.develop([PackageSpec(path = abspath(folder))
          for folder in split(ENV["DEVELOP"])])'
      - name: Test
        run: >-
          julia --project="$RUNNER_TEMP/environment"
          -e 'using Pkg; Pkg.test(ENV["PACKAGE"]; coverage = true)'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: ${{ matrix.coverage }}
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: ${{ matrix.package }}
          use_oidc: true
          fail_ci_if_error: false
